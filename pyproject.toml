[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gt7coach"
version = "0.1.0a0"
description = "Open-source real-time AI driving coach for Gran Turismo 7."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "GT7 AI Coach contributors" }]
keywords = ["gran-turismo", "gt7", "telemetry", "racing", "coach"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Simulation",
]
dependencies = [
    "pycryptodome>=3.20",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
anthropic = ["anthropic>=0.39"]
openai = ["openai>=1.40"]
gemini = ["google-genai>=0.3"]
ollama = ["requests>=2.32"]
voice = ["pyttsx3>=2.90"]
all = [
    "anthropic>=0.39",
    "openai>=1.40",
    "google-genai>=0.3",
    "requests>=2.32",
    "pyttsx3>=2.90",
]

[project.urls]
Homepage = "https://github.com/szilvasolutions/GT7_AI_coach"
Issues = "https://github.com/szilvasolutions/GT7_AI_coach/issues"

[project.scripts]
gt7coach-capture = "gt7coach.capture:main"
gt7coach-coach = "gt7coach.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["legacy", "sessions", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "RUF", # ruff
]
ignore = [
    "E501",  # line too long (formatter handles where it can)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
