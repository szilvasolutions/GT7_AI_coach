# Copy to config.yaml and edit. config.yaml is gitignored.

network:
  ps5_ip: auto              # or 192.168.1.120
  port_rx: 33740
  port_tx: 33739
  heartbeat_seconds: 10
  # Heartbeat byte selects the packet format. 'B' (316 bytes) is the default
  # because it exposes the steering angle and body-force fields that the
  # detectors need. Use 'A' (296 bytes) only if you have a specific reason.
  packet_format: B

coach:
  provider: anthropic        # anthropic | openai | gemini | ollama
  # model is PROVIDER-SPECIFIC. Leave blank to use the provider's default
  # (claude-haiku-4-5 for anthropic, gpt-4o-mini for openai, gemini-2.5-flash
  # for gemini, llama3.1:8b for ollama).
  # model: claude-haiku-4-5
  driver_style: smooth       # smooth | aggressive | learning
  global_rate_limit_seconds: 4
  # car_class is a free-form string spliced into every coaching prompt so the
  # AI can tailor advice to your drivetrain / power tier. Examples:
  # "Gr.3 RWD", "Gr.4 AWD", "N300 FWD", "Vintage GT3", "Formula".
  # car_class: "Gr.3 RWD"
  # Force a known track by id (skip auto-detection from GPS). Built-in IDs:
  # deep_forest. Leave blank to auto-detect; falls back to generic coaching.
  # track: deep_forest

voice:
  engine: pyttsx3            # pyttsx3 | piper | system (alias of pyttsx3) | null
  speed: 200                 # words/min; 230 felt rushed in cockpit audio
  piper_voice: en_US-amy-medium

detectors:
  # Remove a line to disable that detector. quality.clean_corner (positive
  # feedback) always runs and only fires when nothing below did.
  enabled:
    - corner.segment
    - braking.late_brake
    - braking.lockup
    - braking.trail_off_too_fast
    - throttle.wheelspin
    - throttle.sawing
    - throttle.early_lift
    - steering.understeer
    - steering.oversteer
    - line.late_apex
  thresholds:
    corner_min_speed_kmh: 45
    corner_entry_brake: 65
    corner_entry_lat_g: 0.95
    corner_min_dwell_s: 0.5

session:
  log_dir: ./sessions
  rotation_mb: 10            # reserved — log rotation not implemented yet
  generate_summary: true
  # End-of-lap voice mode. 'recommendation' = LLM-generated summary (current
  # behaviour); 'best_lap' = short PB / delta callout only, no LLM call
  # (free-tier-friendly); 'both' = callout then summary.
  lap_announce_mode: both

# VR voice-HUD alerts: spoken callouts replacing the unreadable in-headset
# digital HUD. Each alert can be toggled independently; all alerts share the
# global coach.global_rate_limit_seconds cooldown.
vr_alerts:
  tyre_temp_enabled: true
  tyre_temp_hot_c: 110.0
  tyre_temp_cold_c: 60.0
  fuel_enabled: true
  fuel_low_laps_remaining: 3.0       # warn when fewer than N laps of fuel left
  fuel_critical_laps_remaining: 1.5
  coolant_enabled: true
  oil_hot_c: 130.0
  water_hot_c: 110.0
  shift_assist_enabled: false        # chatty — opt-in only
  self_delta_enabled: true
  self_delta_threshold_ms: 300       # only speak if |delta| > 0.3s
