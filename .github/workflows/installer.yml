name: Installer stub

# INSTALL-GT7-COACH.exe is a binary committed to the repo root, so it can't
# be reviewed by reading a diff. These jobs are the review: the source still
# compiles clean, and the exe that is actually committed really does install
# and launch the app on a real Windows machine.

on:
  push:
    branches: [main]
    paths:
      - "packaging/installer_stub.c"
      - "INSTALL-GT7-COACH.exe"
      - ".github/workflows/installer.yml"
  pull_request:
    paths:
      - "packaging/installer_stub.c"
      - "INSTALL-GT7-COACH.exe"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiles:
    name: Source compiles clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64

      - name: Cross-compile the stub
        run: |
          x86_64-w64-mingw32-gcc -O2 -s -mwindows -municode -Wall -Wextra -Werror \
              -o /tmp/stub.exe packaging/installer_stub.c -lshell32
          file /tmp/stub.exe
          file /tmp/stub.exe | grep -q 'PE32+ executable' || {
            echo "::error::stub did not build as a 64-bit Windows binary"; exit 1; }

  installs:
    name: Committed exe installs the app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the committed stub headless
        shell: pwsh
        run: |
          # /S skips the confirmation dialog. The stub unpacks into its own
          # folder, so give it a scratch one.
          $work = Join-Path $env:RUNNER_TEMP 'stubtest'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Copy-Item INSTALL-GT7-COACH.exe $work
          Start-Process -FilePath (Join-Path $work 'INSTALL-GT7-COACH.exe') -ArgumentList '/S'

          # The stub returns immediately; PowerShell does the work behind it.
          $exe = Join-Path $work 'GT7Coach\GT7Coach.exe'
          $deadline = (Get-Date).AddMinutes(10)
          while (-not (Test-Path $exe) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 10
          }
          if (-not (Test-Path $exe)) {
            # The stub transcribes its PowerShell session here; without it a
            # failure looks identical to a slow download.
            $log = Join-Path $work 'install-log.txt'
            if (Test-Path $log) {
              echo "----- install-log.txt -----"
              Get-Content $log
              echo "---------------------------"
            } else {
              echo "no install-log.txt written - the stub never started PowerShell"
            }
            throw "the stub did not produce $exe - install failed or timed out"
          }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          echo "installed GT7Coach.exe ($mb MB)"

      - name: Confirm it also started the app
        shell: pwsh
        run: |
          $p = Get-Process GT7Coach -ErrorAction SilentlyContinue
          if (-not $p) { throw "the stub installed the app but never launched it" }
          echo "GT7Coach is running (pid $($p.Id -join ','))"
          $p | Stop-Process -Force
