name: Release Windows bundle

# Real releases: push a tag like v0.1.17.
# Test builds: run manually (workflow_dispatch) — these DO NOT publish a
# GitHub Release (so the public /releases/latest link is never clobbered);
# they upload the installer + zip as workflow artifacts instead.
#
# Build stack (Plan B, no code signing):
#   * app      -> Nuitka --standalone  (real machine code => far fewer AV
#                 false-positives than the old PyInstaller bootloader)
#   * updater  -> Nuitka --onefile     (tiny self-contained stub, dropped
#                 flat next to GT7Coach.exe as the app expects)
#   * installer-> Inno Setup wizard     (newbie "Next -> Next -> Install")
# The heavily-flagged PyInstaller one-file exe is intentionally gone.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Label for a TEST build (no release is published)"
        required: false
        default: "vdev"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Resolve tag / release-vs-test
        id: vars
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            $isRelease = "${{ github.ref }}" -like "refs/tags/v*"
          } else {
            $tag = "${{ github.event.inputs.tag }}"
            if (-not $tag) { $tag = "vdev" }
            $isRelease = $false
          }
          $version = $tag.TrimStart("v")
          # Nuitka's --file-version / --product-version must be numeric (X.Y.Z.W).
          # Test tags like "vdev-nuitka" are not, so derive a numeric fallback.
          $mm = [regex]::Match($version, '^[0-9]+\.[0-9]+\.[0-9]+')
          $numver = if ($mm.Success) { $mm.Value } else { "0.0.0" }
          "tag=$tag"           | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "numver=$numver"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "is_release=$($isRelease.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "tag=$tag version=$version numver=$numver is_release=$isRelease"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install "nuitka>=2.4"
          pip install -e ".[gui,all]"

      - name: Build GT7Coach.exe (Nuitka standalone)
        shell: pwsh
        run: |
          # Only include optional packages that are actually importable. Nuitka
          # hard-fails on a missing --include-package, and comtypes (pyttsx3's
          # SAPI5 backend) / google.api_core may not be installed. --include-package
          # on pyttsx3 already pulls its drivers.sapi5 submodule. Crypto
          # (pycryptodome) loads cipher backends dynamically, so force it in.
          $optional = @('pyttsx3','comtypes','anthropic','openai','google.genai','google.auth','google.api_core','Crypto')
          $inc = @()
          foreach ($p in $optional) {
            python -c "import importlib; importlib.import_module('$p')" 2>$null
            if ($LASTEXITCODE -eq 0) { $inc += "--include-package=$p" }
            else { Write-Host "note: optional package not importable, skipping include: $p" }
          }
          $nk = @(
            '--standalone','--assume-yes-for-downloads',
            '--enable-plugin=pyside6','--windows-console-mode=disable',
            '--company-name=Szilva Solutions','--product-name=GT7 AI Coach',
            '--file-version=${{ steps.vars.outputs.numver }}.0',
            '--product-version=${{ steps.vars.outputs.numver }}.0',
            '--include-package-data=gt7coach',
            '--include-data-dir=src/gt7coach/tracks/data=gt7coach/tracks/data',
            '--include-data-dir=src/gt7coach/gui/assets=gt7coach/gui/assets',
            '--include-data-files=config.example.yaml=config.example.yaml'
          ) + $inc + @(
            '--output-filename=GT7Coach.exe','--output-dir=build-nuitka',
            'src/gt7coach/gui/app.py'
          )
          Write-Host "nuitka args: $($nk -join ' ')"
          python -m nuitka @nk
          if (-not (Test-Path build-nuitka/app.dist/GT7Coach.exe)) {
            throw "Nuitka did not produce GT7Coach.exe"
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Move-Item build-nuitka/app.dist dist/GT7Coach
          $mb = [math]::Round((Get-ChildItem -Recurse dist/GT7Coach | Measure-Object Length -Sum).Sum / 1MB, 1)
          Write-Host "GT7Coach folder is $mb MB"

      - name: Build updater.exe (Nuitka onefile)
        shell: pwsh
        run: |
          python -m nuitka --onefile --assume-yes-for-downloads `
            --windows-console-mode=force `
            --company-name="Szilva Solutions" `
            --product-name="GT7 AI Coach Updater" `
            --output-filename=updater.exe `
            --output-dir=build-updater `
            packaging/updater_stub.py
          if (-not (Test-Path build-updater/updater.exe)) { throw "updater.exe not produced" }
          Copy-Item build-updater/updater.exe dist/GT7Coach/updater.exe -Force

      - name: Add distro README
        shell: pwsh
        run: |
          if (Test-Path packaging/README_distro.txt) {
            Copy-Item packaging/README_distro.txt dist/GT7Coach/README.txt -Force
          }

      - name: Smoke-test that GT7Coach.exe launches
        shell: pwsh
        run: |
          $exe = "dist/GT7Coach/GT7Coach.exe"
          $proc = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 8
          if ($proc.HasExited -and $proc.ExitCode -ne 0) {
            throw "GT7Coach.exe exited prematurely with code $($proc.ExitCode)"
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Write-Host "smoke ok"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build the Inno Setup installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=${{ steps.vars.outputs.version }}" "/DMySrcDir=$($PWD.Path)\dist\GT7Coach" packaging\gt7coach.iss
          $setup = "dist/installer/GT7Coach-Setup.exe"
          if (-not (Test-Path $setup)) { throw "installer not produced at $setup" }
          "SETUP_PATH=$setup" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SETUP_NAME=GT7Coach-Setup.exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Zip the portable distribution
        shell: pwsh
        run: |
          $zipName = "GT7Coach-${{ steps.vars.outputs.tag }}-win64.zip"
          Push-Location dist
          Compress-Archive -Path GT7Coach -DestinationPath $zipName -Force
          Pop-Location
          "ZIP_PATH=dist/$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ZIP_NAME=$zipName"      | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compute SHA-256 sums
        shell: pwsh
        run: |
          $lines = @()
          $lines += "$((Get-FileHash -Algorithm SHA256 $env:ZIP_PATH).Hash.ToLower()) *$env:ZIP_NAME"
          $lines += "$((Get-FileHash -Algorithm SHA256 $env:SETUP_PATH).Hash.ToLower()) *$env:SETUP_NAME"
          $lines | Out-File -FilePath dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      # ---- TEST build: upload artifacts, do NOT publish a release ----
      - name: Upload test artifacts
        if: steps.vars.outputs.is_release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: GT7Coach-${{ steps.vars.outputs.tag }}
          path: |
            ${{ env.SETUP_PATH }}
            ${{ env.ZIP_PATH }}
            dist/SHA256SUMS.txt
          retention-days: 14

      # ---- REAL release (v* tag): publish the GitHub Release ----
      - name: Publish GitHub Release
        if: steps.vars.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: GT7 AI Coach ${{ steps.vars.outputs.tag }}
          draft: false
          generate_release_notes: true
          files: |
            ${{ env.SETUP_PATH }}
            ${{ env.ZIP_PATH }}
            dist/SHA256SUMS.txt
